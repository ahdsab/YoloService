name: Yolo Build and Push
on:
  push:
    branches: [ main ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          TS=$(date +%Y%m%d-%H%M%S)
          echo "TAG=${SHORT_SHA}-${TS}" >> $GITHUB_OUTPUT

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yoloservice:${{ steps.meta.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/yoloservice:latest
